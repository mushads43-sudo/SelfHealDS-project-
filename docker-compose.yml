# Local end-to-end stack: SelfHealDS + Prometheus + Grafana.
#   docker compose up --build -d
#   App:        http://localhost:8501
#   Metrics:    http://localhost:8000/metrics
#   Prometheus: http://localhost:9090   (Status > Targets, Alerts)
#   Grafana:    http://localhost:3000   (admin / value of GRAFANA_ADMIN_PASSWORD, default "admin")
services:
  selfhealds:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-local}
    image: selfhealds:local
    ports:
      - "8501:8501"
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    read_only: true
    tmpfs:
      - /tmp
      - /home/app:uid=10001,gid=10001
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - selfhealds

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./k8s/monitoring/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
