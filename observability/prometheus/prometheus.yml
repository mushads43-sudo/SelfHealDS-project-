# Local Prometheus for the docker-compose stack (no Kubernetes).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []          # add alertmanager:9093 if you run one locally

scrape_configs:
  - job_name: selfhealds
    metrics_path: /metrics
    static_configs:
      - targets: ["selfhealds:8000"]
        labels:
          environment: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
