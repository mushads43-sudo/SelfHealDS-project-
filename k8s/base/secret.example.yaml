# OPTIONAL - only needed for the E10 LLM-baseline comparison feature.
# Do NOT commit a real key. Create the secret imperatively instead:
#   kubectl -n selfhealds create secret generic selfhealds-secrets \
#     --from-literal=ANTHROPIC_API_KEY='<your-key>'
# The Deployment marks this secret optional, so the app runs without it.
apiVersion: v1
kind: Secret
metadata:
  name: selfhealds-secrets
  namespace: selfhealds
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "replace-me"
