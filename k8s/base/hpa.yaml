apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: selfhealds
  namespace: selfhealds
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: selfhealds
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70     # % of the 250m request
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80     # % of the 512Mi request
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      # Scale down slowly: removing a pod ends the Streamlit sessions on it.
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
