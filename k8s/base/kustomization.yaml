apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: selfhealds

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: selfhealds
      app.kubernetes.io/managed-by: kustomize

# The CD pipeline runs:
#   kustomize edit set image selfhealds=<acr>.azurecr.io/selfhealds:<git-sha>
images:
  - name: selfhealds
    newName: selfhealdsacr.azurecr.io/selfhealds
    newTag: latest
