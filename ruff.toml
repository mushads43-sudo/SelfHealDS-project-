# CI lint policy for SelfHealDS.
# The research code is intentionally left untouched, so CI blocks only on
# genuine defects (undefined names, syntax errors, redefinitions, broken
# comparisons) and reports style findings without failing the build.
target-version = "py312"
line-length = 160
extend-exclude = ["paper", "figures", "tables", "research_outputs", "data"]

[lint]
select = ["E9", "F"]
# Unused imports/variables and the duplicated taxonomy key are harmless in the
# current code; they are tracked as clean-up items rather than CI blockers.
ignore = ["F401", "F841", "F601"]
